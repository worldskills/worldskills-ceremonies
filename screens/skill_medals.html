<div class="screen-content screen-content-skill-medals screen-skill-medals screen-skill-medals-{{ context.skill.number }}">
    <div class="screen-skill-medals-name screen-region-kv">
        {{ context.skill.name }}
    </div>
    <div class="screen-skill-medals-medals screen-region-state screen-grid"
         style="--grid-count: {{ context.results.length }}; --grid-cols: {{ context.results.length >= 5 ? 2 : 1 }};">
        <div class="screen-medal screen-medal-{{ result.medal }}" ng-repeat="result in context.results"
             style="--grid-chars: {{ result.nameChars || 40 }}; --grid-chars-wrap: {{ result.nameWrapped || result.nameChars || 40 }};">

           <div class="screen-medal-row">
               <div class="screen-medal-row-position">
                   <span>{{ result.medal }}</span>
               </div>
               <div class="screen-medal-row-competitors">
                   <div class="screen-flag">
                       <img ng-src="data/flags/{{ result.memberCode }}.png" onerror="this.onerror=null;this.src='data/flags/_placeholder.svg'">
                   </div>
                   <div class="screen-medal-text">
                       <div class="screen-competitors">
                           <span>{{ result.competitors.join(', ') }}</span>
                       </div>
                   </div>
               </div>
           </div>
        </div>
    </div>
</div>
