<div class="screen-content screen-content-skill-callup screen-content-skill-callup-{{ context.skill.number }}">
    <div class="screen-skill-callup-name screen-region-kv">
        <div class="screen-translation" style="--translation-lines: {{ languages.length || 1 }};">
            <span class="screen-translation-line" ng-repeat="l in languages" ng-class="{'screen-translation-primary': $index === 0}"
                  translate="{{ context.skill.name }}" translate-language="{{ l.lang_code }}"></span>
        </div>
    </div>
    <div class="screen-skill-callup-countries screen-region-state">
        <div class="screen-table-countries"
             style="--callup-count: {{ context.results.length }}; --callup-chars: {{ context.maxMemberLen || 14 }}; --callup-chars-wrap: {{ context.maxMemberWrap || context.maxMemberLen || 14 }};">
            <div class="screen-table-country" ng-repeat="result in context.results">
                <img ng-src="data/flags/{{ result.memberCode }}.png" onerror="this.onerror=null;this.src='data/flags/_placeholder.svg'" class="screen-img-flag">
                <span>{{ result.member }}</span>
            </div>
        </div>
    </div>
</div>
