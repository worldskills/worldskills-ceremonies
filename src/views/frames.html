<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Ceremonies Frames</title>
        <link href="../css/frames.css" rel="stylesheet" />
    </head>
    <body>
        <div id="grid"></div>
        <div id="grid-loading" class="grid-loading">Preparing podium views…</div>
        <script>
            (function () {
                var params = new URLSearchParams(window.location.search);
                var frames = [];
                try {
                    frames = JSON.parse(params.get("frames") || "[]");
                } catch (e) {
                    frames = [];
                }

                var cols = parseInt(params.get("cols"), 10) || 2;
                var gridState = [];
                try {
                    var configuredState = JSON.parse(params.get("dynamicState") || "[]");
                    if (Array.isArray(configuredState))
                        gridState = configuredState.filter(function (id) {
                            return typeof id === "string";
                        });
                } catch (_error) {
                    /* No per-Grid functionality selected. */
                }
                var cellW = parseInt(params.get("cellW"), 10) || 1100;
                var cellH = parseInt(params.get("cellH"), 10) || 500;
                var gap = parseInt(params.get("gap"), 10) || 0;
                var feed = params.get("feed") || "live";
                var feedType = params.get("feedType") || "";
                var maxW = parseInt(params.get("maxW"), 10) || Number.MAX_SAFE_INTEGER;
                var maxH = parseInt(params.get("maxH"), 10) || Number.MAX_SAFE_INTEGER;
                var testMode = params.get("testMode") === "1" || localStorage.getItem("ceremonator:testMode") === "1";
                var fullscreen = params.get("fullscreen") === "1";
                // maxW/maxH are the wall's own resolution, not an available maximum.
                var pinned = params.get("pinned") === "1";
                var autoFit = params.get("autoFit") === "1";
                var feedVideo = "";

                if (fullscreen) document.body.classList.add("grid-fullscreen");
                if (autoFit) document.body.classList.add("grid-autofit");

                var root = document.getElementById("grid");
                var loading = document.getElementById("grid-loading");

                var rootStyle = document.documentElement.style;
                rootStyle.setProperty("--grid-cols", cols);
                rootStyle.setProperty("--cell-w", cellW + "px");
                rootStyle.setProperty("--cell-h", cellH + "px");
                rootStyle.setProperty("--grid-gap", gap + "px");

                var byId = {};
                frames.forEach(function (f) {
                    byId[f.frameId] = f;
                });

                function applyConditions() {
                    Array.prototype.forEach.call(root.querySelectorAll("[data-when-state]"), function (el) {
                        var spec = el.getAttribute("data-when-state") || "";
                        var negate = spec.charAt(0) === "!";
                        var match = gridState.indexOf(negate ? spec.slice(1) : spec) >= 0;
                        if (negate === match) el.parentNode.removeChild(el);
                    });
                    Array.prototype.forEach.call(root.querySelectorAll("[data-when-cols]"), function (el) {
                        var spec = el.getAttribute("data-when-cols") || "";
                        var negate = spec.charAt(0) === "!";
                        var match = parseInt(negate ? spec.slice(1) : spec, 10) === cols;
                        if (negate === match) el.parentNode.removeChild(el);
                    });
                }

                function expandEach() {
                    Array.prototype.forEach.call(root.querySelectorAll("[data-frame-each]"), function (proto) {
                        var parent = proto.parentNode;
                        var repeat = parseInt(proto.getAttribute("data-frame-repeat"), 10) || 1;
                        frames.forEach(function (frame) {
                            for (var i = 0; i < repeat; i++) {
                                var el = proto.cloneNode(true);
                                el.removeAttribute("data-frame-each");
                                el.removeAttribute("data-frame-repeat");
                                if (!el.hasAttribute("data-frame")) el.setAttribute("data-frame", frame.frameId);
                                if (!el.hasAttribute("data-label"))
                                    el.setAttribute("data-label", frame.label || frame.frameId);
                                if (frame.container && !el.hasAttribute("data-container"))
                                    el.setAttribute("data-container", frame.container);
                                parent.insertBefore(el, proto);
                            }
                        });
                        parent.removeChild(proto);
                    });
                }

                var cells = [];
                var cellFrames = [];
                var pendingViews = [];
                var sourceRequestId = 0;
                var dynamicStateKey = "ceremonator:dynamicState";
                var mappingErrors = {};
                var gridVideo;
                var currentVideo = "";

                function selectedFeedVideo() {
                    var active = cellFrames.filter(function (iframe) {
                        return iframe.classList.contains("is-active");
                    });
                    if (typeof feedVideo === "string") return feedVideo;
                    if (!feedVideo || typeof feedVideo !== "object") return "";
                    var activeKinds = new Set(
                        active.map(function (iframe) {
                            return iframe.dataset.slideKind;
                        }),
                    );
                    var kind = Object.keys(feedVideo).find(function (name) {
                        return name !== "default" && activeKinds.has(name);
                    });
                    return (kind && feedVideo[kind]) || feedVideo.default || "";
                }

                function applyFeedVideo() {
                    var filename = selectedFeedVideo();
                    if (gridVideo && filename !== currentVideo) {
                        currentVideo = filename;
                        gridVideo.hidden = !filename;
                        if (filename) {
                            gridVideo.src = "wstemplate://active/videos/" + filename;
                            gridVideo.play().catch(function () {});
                        } else {
                            gridVideo.removeAttribute("src");
                            gridVideo.load();
                        }
                    }
                    cellFrames.forEach(function (iframe) {
                        if (iframe.__loaded && iframe.contentWindow) {
                            iframe.contentWindow.postMessage(
                                { type: "grid-feed-background", enabled: !!filename },
                                "*",
                            );
                        }
                    });
                }

                function readDynamicState() {
                    try {
                        var state = JSON.parse(localStorage.getItem(dynamicStateKey) || "[]");
                        return (Array.isArray(state) ? state : []).concat(gridState);
                    } catch (_error) {
                        return gridState.slice();
                    }
                }

                function mappingError(message) {
                    if (mappingErrors[message]) return;
                    mappingErrors[message] = true;
                    if (window.ceremonator && window.ceremonator.app) {
                        window.ceremonator.app.reportDebug("load-failure", message);
                    }
                }

                function sourceFor(cell, state) {
                    var mapping = cell.mapping;
                    for (var i = 0; i < state.length; i++) {
                        if (!Object.prototype.hasOwnProperty.call(mapping, state[i])) continue;
                        var id = mapping[state[i]];
                        if (typeof id === "string" && Object.prototype.hasOwnProperty.call(byId, id)) return id;
                        mappingError("Grid functionality “" + state[i] + "” names an unavailable frame.");
                        break;
                    }
                    return cell.originalId;
                }

                function showCellSource(cell, id) {
                    var original = id === cell.originalId;
                    var frame = byId[id] || {};
                    cell.caption.textContent = original ? cell.label : frame.label || id;
                    cell.caption.hidden = !cell.caption.textContent;
                    cell.element.style.setProperty("--cell-accent", original ? cell.accent : frame.accent || "");
                    cell.views.forEach(function (iframe) {
                        var active = iframe.dataset.frameId === id;
                        iframe.classList.remove("is-preparing");
                        iframe.classList.toggle("is-active", active);
                        iframe.setAttribute("aria-hidden", String(!active));
                        iframe.tabIndex = active ? 0 : -1;
                    });
                    cell.activeId = id;
                    cell.nextId = null;
                    cell.requestId = null;
                    applyFeedVideo();
                }

                function prepareView(iframe, requestId) {
                    // Never inspect contentWindow before this iframe's own load.
                    if (!iframe.__loaded) return;
                    iframe.contentWindow.postMessage({ type: "grid-cell-prepare", requestId: requestId }, "*");
                }

                function updateCellSource(cell, state) {
                    var id = sourceFor(cell, state);
                    // Pooled originals stay loaded and in sync while hidden. Restore them
                    // immediately so the old highlighted source cannot receive the next slide.
                    if (!cell.activeId || id === cell.activeId || id === cell.originalId) {
                        showCellSource(cell, id);
                    } else if (id !== cell.nextId) {
                        cell.nextId = id;
                        cell.requestId = ++sourceRequestId;
                        cell.views.forEach(function (iframe) {
                            var preparing = iframe.dataset.frameId === id;
                            // Render the incoming view underneath the current opaque screen.
                            iframe.classList.toggle("is-preparing", preparing);
                            if (preparing) prepareView(iframe, cell.requestId);
                        });
                    }
                    return cell.activeId;
                }

                function applyDynamicSources() {
                    var state = readDynamicState();
                    var ids = [...new Set(cells.map((cell) => updateCellSource(cell, state)))];
                    if (cells.length && window.ceremonator && window.ceremonator.grid) {
                        window.ceremonator.grid.sources(ids);
                    }
                    return ids;
                }

                window.addEventListener("storage", function (event) {
                    if (event.key === dynamicStateKey) applyDynamicSources();
                });

                function reportCellSizes() {
                    cellFrames.forEach(function (iframe) {
                        if (!iframe.__loaded || !iframe.contentWindow) return;
                        // Hidden pooled views have no box; their cell keeps the output dimensions.
                        var box = iframe.parentElement.getBoundingClientRect();
                        var w = Math.round(box.width);
                        var h = Math.round(box.height);
                        iframe.contentWindow.postMessage({ type: "grid-cell-size", width: w, height: h }, "*");
                    });
                }

                function fillCell(el, cellIndex) {
                    var frameId = el.getAttribute("data-frame");
                    var frame = byId[frameId] || {};
                    var container = el.getAttribute("data-container") || "";
                    var label = el.hasAttribute("data-label") ? el.getAttribute("data-label") : frame.label || "";
                    var accent = el.getAttribute("data-accent") || frame.accent || "";
                    if (accent) el.style.setProperty("--cell-accent", accent);

                    var mappingElement = el.closest("[data-frame-states]");
                    var mapping = {};
                    if (mappingElement) {
                        try {
                            mapping = JSON.parse(mappingElement.getAttribute("data-frame-states"));
                            if (!mapping || typeof mapping !== "object" || Array.isArray(mapping)) throw new Error();
                        } catch (_error) {
                            mapping = {};
                            mappingError(
                                "Grid data-frame-states must be a JSON object of functionality ID to frame ID.",
                            );
                        }
                    }
                    var caption = document.createElement("div");
                    caption.className = "frame-cell-caption";
                    var cell = {
                        element: el,
                        originalId: frameId,
                        mapping: mapping,
                        label: label,
                        accent: accent,
                        caption: caption,
                        views: [],
                    };
                    cells.push(cell);
                    var ids = [frameId].concat(
                        Object.keys(mapping).map(function (key) {
                            return mapping[key];
                        }),
                    );
                    var fragment = document.createDocumentFragment();
                    Array.from(new Set(ids)).forEach(function (id) {
                        if (id !== frameId && !Object.prototype.hasOwnProperty.call(byId, id)) return;
                        var iframe = document.createElement("iframe");
                        var query = new URLSearchParams({
                            screen: id,
                            feed: feed,
                            feedType: feedType,
                            dynamicState: JSON.stringify(gridState),
                            testPrefix: el.getAttribute("data-test-prefix") || "TEST #",
                            testIdx: cellIndex + 1,
                            gridCols: cols,
                        });
                        if (container) query.set("container", container);
                        if (label) query.set("label", label);
                        if (testMode) query.set("testMode", "1");
                        iframe.src = "screen.html?" + query.toString();
                        iframe.dataset.frameId = id;
                        iframe.title = (byId[id] && byId[id].label) || id;
                        iframe.scrolling = "no";
                        iframe.className = "frame-cell-screen";
                        cell.views.push(iframe);
                        cellFrames.push(iframe);
                        pendingViews.push(
                            new Promise(function (resolve, reject) {
                                var timer = setTimeout(function () {
                                    reject(
                                        new Error(
                                            "Podium “" + id + "” did not finish preparing. Reload the Grid to retry.",
                                        ),
                                    );
                                }, 30000);
                                iframe.__ready = function (requestId) {
                                    clearTimeout(timer);
                                    resolve();
                                    if (cell.nextId === id && cell.requestId === requestId) {
                                        showCellSource(cell, id);
                                        applyDynamicSources();
                                    }
                                };
                            }),
                        );
                        iframe.addEventListener("load", function () {
                            iframe.__loaded = true;
                            reportCellSizes();
                            applyFeedVideo();
                            prepareView(iframe, cell.nextId === id ? cell.requestId : undefined);
                        });
                        fragment.appendChild(iframe);
                    });
                    fragment.appendChild(caption);
                    el.appendChild(fragment);
                    return updateCellSource(cell, readDynamicState());
                }

                function applyAutoFit() {
                    if (!autoFit) return;
                    var w = root.offsetWidth;
                    var h = root.offsetHeight;
                    if (!w || !h) return;
                    root.style.transformOrigin = "top left";
                    root.style.transform = "scale(" + window.innerWidth / w + ", " + window.innerHeight / h + ")";
                }

                function fitAndShow(frameIds) {
                    var grid = root.querySelector(".frames-grid");
                    var naturalWidth = grid ? grid.scrollWidth : root.scrollWidth;
                    var naturalHeight = grid ? grid.scrollHeight : root.scrollHeight;
                    var scale = Math.min(1, maxW / naturalWidth, maxH / naturalHeight);
                    var authoredW = pinned ? maxW : naturalWidth;
                    var authoredH = pinned ? maxH : naturalHeight;
                    var fittedWidth = autoFit ? authoredW : Math.max(1, Math.floor(naturalWidth * scale));
                    var fittedHeight = autoFit ? authoredH : Math.max(1, Math.floor(naturalHeight * scale));

                    if (grid && scale < 1 && !autoFit) {
                        grid.style.transformOrigin = "top left";
                        grid.style.transform = "scale(" + scale + ")";
                    }
                    root.style.width = fittedWidth + "px";
                    root.style.height = fittedHeight + "px";
                    root.style.overflow = "hidden";
                    applyAutoFit();
                    // Pool startup has completed; report the final scaled dimensions to every view.
                    reportCellSizes();

                    if (window.ceremonator && window.ceremonator.grid) {
                        window.ceremonator.grid.fit({
                            width: fittedWidth,
                            height: fittedHeight,
                            frameIds: frameIds,
                        });
                    }
                }

                function build(html) {
                    // innerHTML does not execute <script>, deliberately — grid templates are declarative.
                    root.innerHTML = html;
                    gridVideo = document.createElement("video");
                    gridVideo.className = "grid-bg-video";
                    gridVideo.autoplay = true;
                    gridVideo.loop = true;
                    gridVideo.muted = true;
                    gridVideo.playsInline = true;
                    gridVideo.hidden = true;
                    root.insertBefore(gridVideo, root.firstChild);
                    applyConditions();
                    expandEach();
                    Array.prototype.forEach.call(root.querySelectorAll("[data-frame]"), fillCell);
                    // Wait for every pooled document to finish preparing before revealing the Grid.
                    return Promise.all(pendingViews).then(function () {
                        loading.remove();
                        fitAndShow(applyDynamicSources());
                    });
                }

                // A black window with no explanation is the worst outcome on show day.
                function fail(message) {
                    cells = [];
                    cellFrames = [];
                    loading.remove();
                    root.innerHTML = "";
                    var p = document.createElement("div");
                    p.className = "frames-grid-error";
                    p.textContent = "Grid view could not load this project’s template/grid.html: " + message;
                    root.appendChild(p);
                    fitAndShow([]);
                }

                if (window.ceremonator && window.ceremonator.grid) {
                    Promise.all([window.ceremonator.grid.template(), window.ceremonator.project.current()])
                        .then(function (results) {
                            var project = results[1] && results[1].project;
                            ((project && project.frames) || []).forEach(function (frame) {
                                if (!Object.prototype.hasOwnProperty.call(byId, frame.id)) {
                                    byId[frame.id] = { frameId: frame.id, label: frame.label, accent: frame.color };
                                }
                            });
                            var selectedFeed = ((project && project.feedTypes) || []).find(function (item) {
                                return item.id === feedType;
                            });
                            feedVideo = (selectedFeed && selectedFeed.video) || "";
                            var html = results[0];
                            if (html) return build(html);
                            else fail("file not found");
                        })
                        .catch(function (error) {
                            fail(error.message || String(error));
                        });
                } else {
                    fail("grid API unavailable");
                }

                window.addEventListener("message", function (event) {
                    var data = event.data;
                    if (!data) return;
                    if (data.type === "grid-cell-ready") {
                        var iframe = cellFrames.find(function (item) {
                            return item.__loaded && item.contentWindow === event.source;
                        });
                        if (iframe) iframe.__ready(data.requestId);
                        return;
                    }
                    if (data.type === "grid-cell-state") {
                        var stateIframe = cellFrames.find(function (item) {
                            return item.contentWindow === event.source;
                        });
                        if (stateIframe) {
                            stateIframe.dataset.slideKind = typeof data.kind === "string" ? data.kind : "";
                            applyFeedVideo();
                        }
                        return;
                    }
                    if (event.source === window || data.type !== "grid-cell-debug") return;
                    if (window.ceremonator && window.ceremonator.app && window.ceremonator.app.reportDebug) {
                        window.ceremonator.app.reportDebug(
                            String(data.debugType || "load-failure"),
                            String(data.message || "").slice(0, 500),
                        );
                    }
                });

                window.addEventListener("keydown", function (e) {
                    if (e.key === "Control") document.body.classList.add("show-overlays");
                });
                window.addEventListener("keyup", function (e) {
                    if (e.key === "Control") document.body.classList.remove("show-overlays");
                });

                window.addEventListener("blur", function () {
                    document.body.classList.remove("show-overlays");
                });

                window.addEventListener("resize", function () {
                    applyAutoFit();
                    reportCellSizes();
                });
            })();
        </script>
    </body>
</html>
