<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ceremonies Frames</title>
    <link href="../css/frames.css" rel="stylesheet">
</head>
<body>
    <div id="grid"></div>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var frames = [];
            try { frames = JSON.parse(params.get('frames') || '[]'); } catch (e) { frames = []; }

            var cellW = parseInt(params.get('cellW'), 10) || 1100;
            var cellH = parseInt(params.get('cellH'), 10) || 500;
            var gap = parseInt(params.get('gap'), 10) || 0;
            var feed = params.get('feed') || 'live';
            var waW = parseInt(params.get('waW'), 10) || 0;
            var waH = parseInt(params.get('waH'), 10) || 0;

            var root = document.getElementById('grid');

            var rootStyle = document.documentElement.style;
            rootStyle.setProperty('--grid-cols', parseInt(params.get('cols'), 10) || 2);
            rootStyle.setProperty('--cell-w', cellW + 'px');
            rootStyle.setProperty('--cell-h', cellH + 'px');
            rootStyle.setProperty('--grid-gap', gap + 'px');

            var byId = {};
            frames.forEach(function (f) { byId[f.frameId] = f; });

            function expandEach() {
                Array.prototype.forEach.call(root.querySelectorAll('[data-frame-each]'), function (proto) {
                    var parent = proto.parentNode;
                    frames.forEach(function (frame) {
                        var el = proto.cloneNode(true);
                        el.removeAttribute('data-frame-each');
                        if (!el.hasAttribute('data-frame')) el.setAttribute('data-frame', frame.frameId);
                        if (!el.hasAttribute('data-label')) el.setAttribute('data-label', frame.label || frame.frameId);
                        if (frame.container && !el.hasAttribute('data-container')) el.setAttribute('data-container', frame.container);
                        parent.insertBefore(el, proto);
                    });
                    parent.removeChild(proto);
                });
            }

            function fillCell(el) {
                var frameId = el.getAttribute('data-frame');
                var frame = byId[frameId] || {};
                var container = el.getAttribute('data-container') || '';
                var label = el.hasAttribute('data-label') ? el.getAttribute('data-label') : (frame.label || '');
                var accent = el.getAttribute('data-accent') || frame.accent || '';
                if (accent) el.style.setProperty('--cell-accent', accent);

                var iframe = document.createElement('iframe');
                var src = 'screen.html?screen=' + encodeURIComponent(frameId) + '&preview=true';
                if (feed === 'preview') src += '&feed=preview';
                if (container) src += '&container=' + encodeURIComponent(container);
                if (label) src += '&label=' + encodeURIComponent(label);
                iframe.src = src;
                iframe.frameBorder = '0';
                iframe.scrolling = 'no';
                iframe.className = 'frame-cell-screen';
                el.appendChild(iframe);

                if (label) {
                    var caption = document.createElement('div');
                    caption.className = 'frame-cell-caption';
                    caption.textContent = label;
                    el.appendChild(caption);
                }
                return frameId;
            }

            function fitAndShow(frameIds) {
                var width = root.scrollWidth;
                var height = root.scrollHeight;
                var scale = Math.min(1, waW && width ? waW / width : 1, waH && height ? waH / height : 1);
                if (scale > 0 && scale < 1) {
                    root.style.transform = 'scale(' + scale + ')';
                    root.style.transformOrigin = 'top left';
                }
                if (window.ceremonator && window.ceremonator.grid) {
                    window.ceremonator.grid.fit({
                        width: Math.round(width * scale),
                        height: Math.round(height * scale),
                        frameIds: frameIds
                    });
                }
            }

            function build(html) {
                // innerHTML does not execute <script>, deliberately — grid templates are declarative.
                root.innerHTML = html;
                expandEach();
                var frameIds = [];
                Array.prototype.forEach.call(root.querySelectorAll('[data-frame]'), function (el) {
                    var id = fillCell(el);
                    if (id && frameIds.indexOf(id) < 0) frameIds.push(id);
                });
                fitAndShow(frameIds);
            }

            // A black window with no explanation is the worst outcome on show day.
            function fail(message) {
                root.innerHTML = '';
                var p = document.createElement('div');
                p.className = 'frames-grid-error';
                p.textContent = 'Grid view could not load this project’s template/grid.html: ' + message;
                root.appendChild(p);
                fitAndShow([]);
            }

            if (window.ceremonator && window.ceremonator.grid) {
                window.ceremonator.grid.template().then(function (html) {
                    if (html) build(html); else fail('file not found');
                }).catch(function (error) {
                    fail(error.message || String(error));
                });
            } else {
                fail('grid API unavailable');
            }

            window.addEventListener('keydown', function (e) {
                if (e.key === 'Control') document.body.classList.add('show-overlays');
            });
            window.addEventListener('keyup', function (e) {
                if (e.key === 'Control') document.body.classList.remove('show-overlays');
            });

            window.addEventListener('blur', function () {
                document.body.classList.remove('show-overlays');
            });
        })();
    </script>
</body>
</html>
