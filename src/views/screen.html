<!DOCTYPE html>
<html lang="en" ng-app="ceremoniesApp" ng-controller="ScreenCtrl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceremonies Screen</title>
    <link href="wstemplate://active/css/screen.css" rel="stylesheet">
    <style>
        .screen-bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        .screen-content .screen-bg-video { display: none; }
        .screen-preview-mark { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
        .screen-preview-badge {
            position: absolute; top: 12px; left: 12px;
            background: rgba(217, 119, 6, 0.92); color: #fff;
            font: bold 14px/1.4 sans-serif; letter-spacing: 0.05em;
            padding: 4px 10px; border-radius: 4px;
        }
        .screen-preview-diagonal {
            position: absolute; top: 46%; left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font: bold 8vw/1 sans-serif; letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.14); white-space: nowrap;
        }
        .screen-test-mark { position: fixed; inset: 0; z-index: 9998; pointer-events: none; overflow: hidden; }
        .screen-test-diagonal {
            position: absolute; top: 46%; left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font: bold 18vw/1 sans-serif; letter-spacing: 0.15em;
            color: rgba(255, 140, 0, 0.5); white-space: nowrap;
        }
        .screen-test-id {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(255, 140, 0, 0.85);
            color: #fff;
            font: bold 20px/1 sans-serif;
            padding: 6px 14px;
            border-radius: 4px;
        }
    </style>
</head>
<body ng-class="{'preview': preview}" style="margin: 0;">

    <video class="screen-bg-video" ng-if="frame.video" ng-src="{{ frame.video }}" autoplay loop muted></video>

    <div class="screen screen-{{ screen }}" ng-class="states" ng-show="!!screen" ng-cloak>
        <div ng-include="template"></div>
    </div>

    <!-- Test mode watermark — shown on all screens when test mode is active -->
    <div class="screen-test-mark" ng-show="testMode" ng-cloak>
        <div class="screen-test-id" ng-show="testIdx">
            <span ng-show="gridCols === 6">W{{ testIdx }}</span>
            <span ng-hide="gridCols === 6">TEST #{{ testIdx }}</span>
        </div>
        <div class="screen-test-diagonal">TEST</div>
    </div>

    <div class="screen-preview-mark" ng-show="feed === FEED.PREVIEW" ng-cloak>
        <div class="screen-preview-diagonal">PREVIEW</div>
        <div class="screen-preview-badge">PREVIEW &middot; {{ frame.label }} &middot; {{ slideLabel || '—' }}</div>
    </div>

    <div class="setup" ng-show="!screen">
        <p style="color:#fff;font-family:sans-serif;padding:20px">Open this screen from the control panel. Press F11 for fullscreen.</p>
    </div>


    <script src="../../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../../node_modules/angular/angular.min.js"></script>
    <script src="../../node_modules/angular-translate/dist/angular-translate.min.js"></script>
    <script src="../../node_modules/ng-file-upload/dist/ng-file-upload.min.js"></script>
    <script src="../js/control/control-workspace.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/directives.js"></script>
    <script src="../js/services/translations-loader.service.js"></script>
    <script src="../js/services/storage-keys.service.js"></script>
    <script src="../js/screen.js"></script>
</body>
</html>
