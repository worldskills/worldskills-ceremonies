<div class="screen-content screen-content-skill-callup screen-content-skill-callup-{{ context.skill.number }}">
    <video class="screen-bg-video" ng-if="frame.video" ng-src="{{ frame.video }}" autoplay loop muted></video>
    <div class="screen-skill-callup-name screen-region-kv">
        <div class="screen-translation screen-translation-row" style="--translation-lines: {{ languages.length || 1 }};">
            <span class="screen-translation-line" ng-repeat="l in languages" ng-class="{'screen-translation-primary': $index === 0}"
                  translate="{{ context.skill.name }}" translate-language="{{ l.lang_code }}"></span>
        </div>
    </div>
    <div class="screen-skill-callup-countries screen-region-state">
        <div class="screen-table-countries"
             style="--callup-count: {{ context.results.length }}; --callup-display: {{ context.results.length <= 4 ? 'flex' : 'grid' }}; --callup-cols: {{ context.results.length <= 4 ? 2 : 3 }}; --callup-chars: {{ context.maxMemberLen || 14 }}; --callup-chars-wrap: {{ context.maxMemberWrap || context.maxMemberLen || 14 }};">
            <div class="screen-table-country" ng-repeat="result in context.results">
                <img ng-src="wstemplate://project/data/flags/{{ result.memberCode }}.png" onerror="this.onerror=null;this.src='wstemplate://project/data/flags/_placeholder.svg'" class="screen-img-flag">
                <div class="screen-translation" style="--translation-lines: {{ languages.length || 1 }};">
                    <span class="screen-translation-line" ng-repeat="l in languages" ng-class="{'screen-translation-primary': $index === 0}"
                          translate="{{ result.member }}" translate-language="{{ l.lang_code }}"></span>
                </div>
            </div>
        </div>
    </div>
</div>
