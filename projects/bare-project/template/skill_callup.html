<div class="screen-content screen-content-skill-callup screen-content-skill-callup-{{ context.skill.number }}">
    <div class="screen-skill-callup-name screen-region-kv" ws-fit>
        <div class="screen-translation screen-translation-row">
            {{ context.skill.number }}
            <span
                class="screen-translation-line"
                ng-repeat="l in languages"
                ng-class="{'screen-translation-primary': $index === 0}"
                translate="{{ context.skill.name }}"
                translate-language="{{ l.lang_code }}"
            ></span>
        </div>
    </div>

    <div
        class="screen-skill-callup-countries screen-region-state screen-table-countries"
        ng-class="{
             'screen-table-countries-cols-1': context.results.length === 1,
             'screen-table-countries-cols-2': context.results.length === 2,
             'screen-table-countries-cols-3': context.results.length === 3 || (context.results.length >= 5 && context.results.length <= 6),
             'screen-table-countries-cols-4': context.results.length === 4 || context.results.length > 6,
             'screen-table-countries-dense': context.results.length >= 5,
             'screen-table-countries-very-dense': context.results.length >= 9
         }"
    >
        <div class="screen-table-country" ng-repeat="result in context.results">
            <div class="screen-table-country-flag">
                <img
                    ng-src="wstemplate://project/data/flags/{{ result.memberCode }}.png"
                    onerror="
                        this.onerror = null;
                        this.src = 'wstemplate://project/data/flags/_placeholder.svg';
                    "
                    class="screen-img-flag"
                />
            </div>
            <div class="screen-translation" ws-fit>
                <span
                    class="screen-translation-line"
                    ng-repeat="l in languages"
                    ng-class="{'screen-translation-primary': $index === 0}"
                    translate="{{ result.member }}"
                    translate-language="{{ l.lang_code }}"
                ></span>
            </div>
        </div>
    </div>
</div>
