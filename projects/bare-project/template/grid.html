<style data-when-state="venue-wall">
    .frames-grid {
        grid-template-columns: repeat(3, var(--cell-w, 1100px));
    }
</style>
<div class="frames-grid" data-frame-states='{"highlight-red":"a","highlight-blue":"b","highlight-yellow":"c"}'>
    <!-- A one-column output follows the active podium highlight. -->
    <div class="frame-cell" data-frame="a" data-when-cols="1" data-when-state="!venue-wall"></div>
    <!-- Rehearsal multiview: one cell per selected frame, no duplication. -->
    <div class="frame-cell" data-frame-each data-when-cols="!1" data-when-state="!venue-wall"></div>

    <div
        class="frame-cell"
        data-when-state="venue-wall"
        data-test-prefix="W"
        data-frame="a"
        data-container="bon-first"
    ></div>
    <!-- W1  Red     -->
    <div
        class="frame-cell"
        data-when-state="venue-wall"
        data-test-prefix="W"
        data-frame="a"
        data-container="bon-second"
    ></div>
    <!-- W2  Red    -->
    <div
        class="frame-cell"
        data-when-state="venue-wall"
        data-test-prefix="W"
        data-frame="c"
        data-container="bon-first"
    ></div>
    <!-- W3  Yellow -->

    <div
        class="frame-cell"
        data-when-state="venue-wall"
        data-test-prefix="W"
        data-frame="c"
        data-container="bon-second"
    ></div>
    <!-- W4  Yellow -->
    <div
        class="frame-cell"
        data-when-state="venue-wall"
        data-test-prefix="W"
        data-frame="b"
        data-container="bon-first"
    ></div>
    <!-- W5  Blue   -->
    <div
        class="frame-cell"
        data-when-state="venue-wall"

    <div
