<style data-when-state="venue-wall">
    .frames-grid {
        grid-template-columns: repeat(3, var(--cell-w, 1100px));
    }
</style>
<div class="frames-grid" data-frame-states='{"highlight-red":"a","highlight-blue":"b","highlight-yellow":"c"}'>
    <!-- Rehearsal multiview: one cell per selected frame, no duplication. -->
    <div class="frame-cell" data-frame-each data-when-state="!venue-wall"></div>

    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="a"></div>
    <!-- W1  Red     -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="a"></div>
    <!-- W2  Red    -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="c"></div>
    <!-- W3  Yellow -->

    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="c"></div>
    <!-- W4  Yellow -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="b"></div>
    <!-- W5  Blue   -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="b"></div>
    <!-- W6  Blue   -->

    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="b"></div>
    <!-- W7  Blue   -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="b"></div>
    <!-- W8  Blue   -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="c"></div>
    <!-- W9  Yellow -->

    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="c"></div>
    <!-- W10 Yellow -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="a"></div>
    <!-- W11 Red    -->
    <div class="frame-cell" data-when-state="venue-wall" data-test-prefix="W" data-frame="a"></div>
    <!-- W12 Red    -->
</div>
