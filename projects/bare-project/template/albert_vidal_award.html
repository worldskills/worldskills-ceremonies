<div class="screen-content screen-content-albert-vidal-award">
    <div class="screen-albert-vidal-award-name screen-region-kv" ws-fit>
        <div class="screen-translation screen-translation-row">
             <span class="screen-translation-line" ng-repeat="l in languages" ng-class="{'screen-translation-primary': $index === 0}"
                   translate="Albert Vidal Award" translate-language="{{ l.lang_code }}"></span>
        </div>
    </div>

    <div class="screen-region-state screen-grid"
         style="--grid-max-cols: {{ context.results.length > 10 ? 2 : 1 }};">
        <div class="screen-medal screen-albert-vidal-award-award" ng-repeat="result in context.results" ws-fit>
            <div class="screen-flag">
                <img ng-src="wstemplate://project/data/flags/{{ result.memberCode }}.png" onerror="this.onerror=null;this.src='wstemplate://project/data/flags/_placeholder.svg'">
            </div>
            <div class="screen-competitors">
                <span>{{ result.competitors.join(', ') }}</span>
            </div>
        </div>
    </div>
</div>
