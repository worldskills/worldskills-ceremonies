<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ceremonies Frames</title>
    <link href="css/frames.css" rel="stylesheet">
</head>
<body>
    <div id="grid" class="frames-grid"></div>
    <div id="panic-overlay" class="frames-panic-overlay"></div>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var cells = [];
            try { cells = JSON.parse(params.get('cells') || '[]'); } catch (e) { cells = []; }

            var cols = parseInt(params.get('cols'), 10) || 2;
            var rows = parseInt(params.get('rows'), 10) || 1;
            var frameW = parseInt(params.get('frameW'), 10) || 1100;
            var frameH = parseInt(params.get('frameH'), 10) || 500;
            var gap = parseInt(params.get('gap'), 10) || 0;
            var scale = parseFloat(params.get('scale')) || 1;

            var grid = document.getElementById('grid');
            grid.style.setProperty('--grid-cols', cols);
            grid.style.setProperty('--grid-rows', rows);
            grid.style.setProperty('--frame-w', frameW + 'px');
            grid.style.setProperty('--frame-h', frameH + 'px');
            grid.style.setProperty('--grid-gap', gap + 'px');
            if (scale > 0 && scale < 1) {
                // Cells shrink to fit the work area instead of spilling off-screen —
                // the grid box itself stays full size and is scaled down as a whole.
                grid.style.transform = 'scale(' + scale + ')';
                grid.style.transformOrigin = 'top left';
            }

            cells.forEach(function (cell) {
                var wrap = document.createElement('div');
                wrap.className = 'frame-cell-wrap';
                if (cell.container) wrap.classList.add('frame-cell-wrap-' + cell.container);
                if (cell.accent) wrap.style.setProperty('--cell-accent', cell.accent);

                var iframe = document.createElement('iframe');
                var src = 'screen.html?screen=' + encodeURIComponent(cell.frameId) + '&preview=true';
                if (cell.container) src += '&container=' + encodeURIComponent(cell.container);
                if (cell.ratio) src += '&ratio=' + encodeURIComponent(cell.ratio);
                if (cell.label) src += '&label=' + encodeURIComponent(cell.label);
                iframe.src = src;
                iframe.width = frameW;
                iframe.height = frameH;
                iframe.frameBorder = '0';
                iframe.scrolling = 'no';
                iframe.className = 'frame-cell';
                wrap.appendChild(iframe);

                // Caption + accent border live OUTSIDE the iframe document, so the
                // label stays visible even if that cell's iframe goes blank/crashes —
                // exactly the moment an operator most needs to identify which cell it is.
                if (cell.label) {
                    var caption = document.createElement('div');
                    caption.className = 'frame-cell-caption';
                    caption.textContent = cell.label;
                    wrap.appendChild(caption);
                }

                grid.appendChild(wrap);
            });

            // Panic path — a full-window overlay is simpler and more reliable than
            // reaching into each iframe individually (subframe preload/IPC delivery
            // isn't guaranteed), and it blacks out the whole wall represented by
            // this window either way.
            if (window.ceremonator && window.ceremonator.onScreenMode) {
                window.ceremonator.onScreenMode(function (data) {
                    var overlay = document.getElementById('panic-overlay');
                    var mode = data && data.mode;
                    if (mode && mode !== 'restore') {
                        overlay.className = 'frames-panic-overlay frames-panic-overlay-' + mode + ' frames-panic-overlay-visible';
                    } else {
                        overlay.className = 'frames-panic-overlay';
                    }
                });
            }
        })();
    </script>
</body>
</html>
